name: Deploy Marketplace to GitHub Pages

on:
  push:
    branches: [ master ]
    paths:
      - 'marketplace/**'
      - '.github/workflows/marketplace.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight production deployment, but skip stale queued runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run marketplace tests
        run: node --test marketplace/test/*.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload marketplace as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: marketplace

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
