<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LN Address Marketplace</title>
  <link rel="stylesheet" href="assets/flowbite-1.7.0.min.css">
  <script src="assets/tailwindcss-3.4.17.js"></script>
  <script src="assets/flowbite-1.7.0.min.js"></script>
  <script src="assets/nostr-tools-2.10.4.bundle.js"></script>
  <script src="assets/qrcode-generator-1.4.4.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen text-gray-900">
  <main class="mx-auto max-w-5xl p-4 sm:p-6 lg:p-8 space-y-6">
    <header class="flex flex-col gap-2 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-3xl font-bold tracking-tight">LN Address Marketplace</h1>
        <p class="mt-1 text-sm text-gray-500">Operators discovered over Nostr. Announcements are claims, not endorsements.</p>
      </div>
      <button id="connect-nostr" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-4 py-2">Connect Nostr</button>
    </header>
    <section id="relay-section" class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
      <h2 class="text-sm font-semibold text-gray-700">Discovery relays</h2>
      <div id="relay-editor" class="mt-2 flex flex-wrap items-center gap-2"></div>
      <div id="relay-status" class="mt-2 flex flex-wrap gap-2 text-xs"></div>
    </section>
    <nav class="flex gap-4 border-b border-gray-200 text-sm font-medium">
      <button data-tab="browse" class="tab-btn border-b-2 border-blue-700 px-1 pb-2 text-blue-700">Browse</button>
      <button data-tab="manage" class="tab-btn hidden border-b-2 border-transparent px-1 pb-2 text-gray-500 hover:text-gray-700">Manage</button>
    </nav>
    <div id="browse-panel" class="space-y-3">
      <section class="rounded-lg border border-gray-200 bg-white p-4 shadow-sm">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
          <div class="flex-1 min-w-[10rem]">
            <label for="browse-search" class="block mb-1 text-xs font-medium text-gray-700">Search</label>
            <input id="browse-search" type="text" placeholder="Domain or supplier" autocomplete="off"
              class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:ring-blue-500 focus:border-blue-500">
          </div>
          <div class="flex-1 min-w-[14rem]">
            <label for="browse-name" class="block mb-1 text-xs font-medium text-gray-700">Check a name</label>
            <div class="flex">
              <input id="browse-name" type="text" placeholder="e.g. satoshi" autocomplete="off"
                class="block w-full min-w-0 p-2 border border-gray-300 rounded-l-lg bg-gray-50 text-gray-900 text-sm focus:ring-blue-500 focus:border-blue-500">
              <label class="inline-flex shrink-0 cursor-pointer select-none items-center gap-1.5 rounded-r-lg border border-l-0 border-gray-300 bg-gray-50 px-3 text-xs font-medium text-gray-700">
                <input id="browse-free-only" type="checkbox" class="h-3.5 w-3.5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                Free only
              </label>
            </div>
          </div>
          <div class="sm:w-72">
            <label for="browse-sort" class="block mb-1 text-xs font-medium text-gray-700">Sort by</label>
            <div class="flex gap-2">
              <select id="browse-sort"
                class="block w-full p-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-900 text-sm focus:ring-blue-500 focus:border-blue-500">
                <option value="alpha">Alphabetical</option>
                <option value="price">Price</option>
                <option value="users">Registered users</option>
              </select>
              <div id="browse-sort-length-wrap" class="hidden shrink-0 items-center">
                <label for="browse-sort-length"
                  class="inline-flex h-full items-center rounded-l-lg border border-r-0 border-gray-300 bg-gray-100 px-2 text-xs font-medium text-gray-600">length</label>
                <input id="browse-sort-length" type="number" min="1" max="64" step="1" value="8"
                  title="Sort by each domain's price for a name of this length"
                  class="block w-14 p-2 border border-gray-300 rounded-r-lg bg-gray-50 text-gray-900 text-sm focus:ring-blue-500 focus:border-blue-500">
              </div>
            </div>
          </div>
        </div>
        <p class="mt-2 text-xs text-gray-500">Prices are computed locally from operator announcements &middot; name availability is only checked when you register</p>
      </section>
      <section id="operators" class="flex flex-col gap-3"></section>
      <p id="operators-placeholder" class="text-sm text-gray-500"></p>
      <p id="operators-hidden-count" class="hidden text-xs text-gray-400"></p>
    </div>
    <section id="manage" class="hidden space-y-4"></section>
  </main>
  <div id="modal-root"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
